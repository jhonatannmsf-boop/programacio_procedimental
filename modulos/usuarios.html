<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>Usuarios</title>
</head>
<body>

    <nav class="navbar" role="navigation">
      <div class="navbar-brand">
        <a class="navbar-item">Mi tierra querida</a>
      </div>

      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            <a href="../index.html" class="button is-primary">
              <strong>Regresar</strong>
            </a>
          </div>
        </div>
      </div>
    </nav>

    <hr>
    <section class="section">
      <div class="container">
        <h1 class="title">Usuarios</h1>

        <form>
          <div class="field">
            <label class="label">Nombre completo</label>
            <div class="control">
              <input class="input" type="text" id="nombre_completo" name="nombre_completo" placeholder="Ingrese el nombre completo" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Email</label>
            <div class="control">
              <input class="input" type="email" id="email" name="email" placeholder="Ingrese el email" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Número de celular</label>
            <div class="control">
              <input class="input" type="tel" id="numero_celular" name="numero_celular" placeholder="Ingrese el número de celular" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Género</label>
            <div class="control">
              <div class="select is-fullwidth">
                <select id="genero" name="genero" required>
                  <option value="">Seleccione</option>
                  <option value="masculino">Masculino</option>
                  <option value="femenino">Femenino</option>
                  <option value="otro">Otro</option>
                </select>
              </div>
            </div>
          </div>

          <div class="field">
            <label class="label">Fecha de nacimiento</label>
            <div class="control">
              <input class="input" type="date" id="fecha_nacimiento" name="fecha_nacimiento" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Dirección</label>
            <div class="control">
              <input class="input" type="text" id="direccion" name="direccion" placeholder="Ingrese la dirección" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Contraseña</label>
            <div class="control">
              <input class="input" type="password" id="contrasena" name="contrasena" placeholder="Ingrese la contraseña" required>
            </div>
          </div>

          <div class="field is-grouped">
            <div class="control">
              <button class="button is-link" type="submit" id="guardar_usuario">Guardar</button>
            </div>
          </div>
        </form>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script src="../js/usuarios.js"></script>
</body>
</html>
