<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <title>pedidos</title>
</head>
<body>

    <nav class="navbar" role="navigation">
      <div class="navbar-brand">
        <a class="navbar-item">Mi tierra querida</a>
      </div>

      <div class="navbar-end">
        <div class="navbar-item">
          <div class="buttons">
            <a href="../index.html" class="button is-primary">
              <strong>Regresar</strong>
            </a>
          </div>
        </div>
      </div>
    </nav>
    
    <hr>
    <section class="section">
      <div class="container">
        <h1 class="title">Pedidos</h1>

        <form>
          <div class="field">
            <label class="label">Nombre completo</label>
            <div class="control">
              <input class="input" type="text" id="nombre_completo" name="nombre_completo" placeholder="Ingrese el nombre completo" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Referencias</label>
            <div class="control">
              <input class="input" type="text" id="referencias" name="referencias" placeholder="Ingrese las referencias" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Pedido</label>
            <div class="control">
              <input class="input" type="text" id="pedido" name="pedido" placeholder="Ingrese el pedido" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Email</label>
            <div class="control">
              <input class="input" type="email" id="email" name="email" placeholder="Ingrese el email" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Número de celular</label>
            <div class="control">
              <input class="input" type="tel" id="numero_celular" name="numero_celular" placeholder="Ingrese el número de celular" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Dirección</label>
            <div class="control">
              <input class="input" type="text" id="direccion" name="direccion" placeholder="Ingrese la dirección" required>
            </div>
          </div>

          <div class="field">
            <label class="label">Método de pago</label>
            <div class="control">
              <input class="input" type="text" id="metodo_pago" name="metodo_pago" placeholder="Ingrese el método de pago" required>
            </div>
          </div>

          <div class="field is-grouped">
            <div class="control">
              <button class="button is-link" type="button" id="guardar_pedido">Enviar</button>
            </div>
          </div>
        </form>
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/pedidos.js"></script>
</body>
</html>
