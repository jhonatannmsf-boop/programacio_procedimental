<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css"
    />
    <link rel="stylesheet" href="../css/invntario.css" />
    <title>Inventario</title>
  </head>
  <body>
    <nav class="navbar" role="navigation">
      <div class="navbar-brand">
        <a class="navbar-item">Mi tierra querida</a>
      </div>
    
    <div class="navbar-end">
      <div class="navbar-item">
        <div class="buttons">
          <a href="../index.html" class="button is-primary">
            <strong>Regresar</strong>
          </a>
          
        </div>
      </div>
    </div>
    </nav>
    <hr />
    <section class="section">
      <div class="container">
        <h1 class="title">Inventario</h1>
          <div class="field">
            <label class="label">Nombre del producto</label>
            <div class="control">
              <input class="input" type="text" id="nombre_producto" name="nombre_producto" placeholder="Ingrese el nombre del producto" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Precio</label>
            <div class="control">
              <input class="input" type="text" id="precio" name="precio" placeholder="Ingrese el precio" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Codigo</label>
            <div class="control">
              <input class="input" type="text" id="codigo" name="codigo" placeholder="Ingrese el código" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Marca</label>
            <div class="control">
              <input class="input" type="text" id="marca" name="marca" placeholder="Ingrese la marca" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Cantidad</label>
            <div class="control">
              <input class="input" type="number" id="cantidad" name="cantidad" placeholder="Ingrese la cantidad" min="0" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Categoria</label>
            <div class="control">
              <input class="input" type="text" id="categoria" name="categoria" placeholder="Ingrese la categoría" required />
            </div>
          </div>
          <div class="field">
            <label class="label">Unidad de medida</label>
            <div class="control">
              <input class="input" type="text" id="unidad_medida" name="unidad_medida" placeholder="Ingrese la unidad de medida" 
               />
            </div>
          </div>
          <div class="field is-grouped">
            <div class="control">
              <button class="button is-link" type="submit" id="guardar_producto">Enviar</button>
            </div>
          </div>
        
      </div>
    </section>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="../js/inventario.js"></script>
  </body>
</html>
